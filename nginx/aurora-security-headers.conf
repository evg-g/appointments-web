# Security response headers for the SPA shell.
#
# Included from each HTML-serving location (a location that sets its own add_header would otherwise
# drop headers inherited from the server block — nginx replaces, it does not merge).
#
# The Content-Security-Policy is deliberately tight:
#   - default-src 'self'           — everything comes from our own origin by default.
#   - script-src 'self' 'unsafe-inline'
#       Vite emits external, hashed script files ('self'). 'unsafe-inline' is required only by the
#       small theme-bootstrap script inlined in index.html (it sets the light/dark class before
#       first paint to avoid a flash). No third-party scripts are loaded.
#   - style-src 'self' 'unsafe-inline'  — Tailwind ships as a stylesheet; some inline styles remain.
#   - img-src 'self' data:; font-src 'self' data:  — self-hosted Inter; small data: URIs.
#   - connect-src 'self'           — API calls and the SSE stream are same-origin (see nginx proxy).
#   - frame-ancestors 'none'; object-src 'none'; base-uri 'self'  — clickjacking / injection hardening.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
